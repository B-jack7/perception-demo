[project]
name = "robot-perception-route-demo"
version = "0.1.0"
description = "Reproducible perception demos for open-vocabulary tabletop manipulation"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.0",
  "matplotlib>=3.9",
  "numpy>=2.0",
  "pillow>=10.4",
  "pypdf>=5.0",
  "reportlab>=4.2",
  "safetensors>=0.4",
  "torch>=2.5",
  "torchvision>=0.20",
  "transformers>=4.57",
]

[tool.uv]
package = false
